<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative grid pattern -->
  <g opacity="0.4" stroke="#CBD5E1" stroke-width="0.75" stroke-dasharray="3 3">
    <line x1="0" y1="75" x2="400" y2="75"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="225" x2="400" y2="225"/>
    <line x1="100" y1="0" x2="100" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
  </g>

  <!-- Central Shadow -->
  <ellipse cx="200" cy="188" rx="55" ry="14" fill="#000000" opacity="0.07"/>

  <!-- Minimalist Isometric Box / Inventory Symbol -->
  <g filter="url(#subtleShadow)">
    <!-- Top Face -->
    <polygon points="200,95 242,118 200,141 158,118" fill="url(#boxTop)"/>
    
    <!-- Left Face -->
    <polygon points="158,118 200,141 200,186 158,163" fill="url(#boxLeft)"/>
    
    <!-- Right Face -->
    <polygon points="200,141 242,118 242,163 200,186" fill="url(#boxRight)"/>
    
    <!-- Package Tape Accent -->
    <polygon points="194,98 206,105 206,144 194,138" fill="#F1F5F9" opacity="0.7"/>
    <polygon points="194,138 206,144 206,186 194,182" fill="#F1F5F9" opacity="0.5"/>
  </g>

  <!-- Photo / Camera outline emblem in circle badge -->
  <circle cx="200" cy="140" r="18" fill="#FFFFFF" opacity="0.92" filter="url(#subtleShadow)"/>
  <path d="M193 135.5C193 134.67 193.67 134 194.5 134H196.5L197.8 132.3C198.1 131.9 198.6 131.7 199.1 131.7H200.9C201.4 131.7 201.9 131.9 202.2 132.3L203.5 134H205.5C206.33 134 207 134.67 207 135.5V144.5C207 145.33 206.33 146 205.5 146H194.5C193.67 146 193 145.33 193 144.5V135.5Z" stroke="#475569" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="200" cy="140.2" r="3.2" stroke="#475569" stroke-width="1.3" fill="none"/>

  <!-- Subtle Label -->
  <text x="200" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#94A3B8">
    KATALOG BARANG
  </text>
  <text x="200" y="238" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="9" font-weight="400" letter-spacing="0.5" fill="#CBD5E1">
    HIMAKOM
  </text>
</svg>
